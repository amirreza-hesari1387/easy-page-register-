<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<section class="registersection">
    <div class="titel">
        <h1>sign up</h1>
        <h5>Let’s Create Your <span>Account</span></h5>
    </div>
    <form class="formsection" action="">
        <div class="halfinput">
            <label  for="">First Name</label><br>
            <input placeholder="Please Type Your Firstname" type="text" required>
        </div>
        <div class="halfinput">
            <label for="">Last Name</label><br>
            <input placeholder="Please Type Your Lastname" type="text">
        </div>
        <div class="lineinput">
            <label for="">Email</label><br>
            <input placeholder="Please Type Your Email" type="email">
        </div>
        <div class="lineinput">
            <label for="">ReType Email</label><br>
            <input placeholder="Please Retype Your Email" type="email">
        </div>
        <div class="lineinput">
            <label for="">password</label><br>
            <input placeholder="Please Type Your Password" type="password">
        </div>
        <div class="lineinput">
            <label for="">ReType password</label><br>
            <input placeholder="Please Retype Your Password" type="password">
        </div>
        <div class="checkboxsection">
            <input class="checkbox" type="checkbox">
            <label for="">I Agree To The Terms & Condtion</label><br>
        </div>
        <div class="buttonsection">
            <button type="submit">sign up</button>
            <!-- <input value="sign up" type='button"> -->
        </div>
    </form>
</section>
</body>
</html>
